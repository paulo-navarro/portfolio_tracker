add_header X-Robots-Tag "noindex, nofollow" always;
# Um ano, subdomínios incluídos. Fica aqui (e não no nginx de borda) porque o
# certbot reescreve o arquivo de lá; navegador ignora HSTS vindo por http.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Tudo da mesma origem. Dois afrouxamentos, e só estes:
#   'unsafe-inline' em style-src: os atributos style do React (largura da barra
#     do ATH, opacidade da fatia da rosca).
#   'wasm-unsafe-eval' em script-src: a libsodium do navegador compila
#     WebAssembly para selar a chave. Conferido: sem isto o cadastro de conta
#     quebra com "Refused to compile or instantiate WebAssembly module". É o
#     mínimo — permite WebAssembly, não permite eval de JavaScript.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
