add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Tudo da mesma origem. style-src precisa de 'unsafe-inline' por causa dos
# atributos style do React (largura da barra do ATH). 'wasm-unsafe-eval' vai
# entrar na fase 5 se a libsodium do navegador pedir.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
