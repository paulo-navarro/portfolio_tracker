# Sem bloco `upstream`: upstream estático é resolvido uma vez, no boot, e api
# recriada com IP novo ficaria apontando para o velho. Com `resolver` +
# variável, o nome é resolvido por requisição.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS embutido do Docker. valid curto: container recriado muda de IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api-prod:3001;

  # Cuidado: `add_header` numa location anula TODOS os herdados do server.
  # Toda location que tiver add_header próprio precisa repetir o include.
  include /etc/nginx/snippets/security-headers.conf;

  client_max_body_size 64k;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Nome com hash do Vite: muda a cada build, pode ser cacheado para sempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
