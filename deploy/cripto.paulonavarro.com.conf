# Edge nginx da VPS. Vai em /etc/nginx/sites-available/ e é linkado em
# sites-enabled/. Esta é a versão http-only, que o certbot consome na primeira
# emissão; depois ele reescreve o arquivo com o bloco 443.
#
# O container publica só em 127.0.0.1:8084, então esta é a única entrada. O
# `/api/` interno já é resolvido pelo nginx do próprio container, e é de lá que
# vêm CSP e os outros cabeçalhos de segurança. Aqui é só TLS, HSTS e repasse.
server {
    listen 80;
    server_name cripto.paulonavarro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

